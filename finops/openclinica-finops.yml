meters:
- name: studies
  description: Number of active studies configured on the OpenClinica instance.
  unit: studies
  aggregation: max
  dimensions:
  - account
- name: participants
  description: Number of enrolled participants (subjects) across studies.
  unit: participants
  aggregation: max
  dimensions:
  - account
  - study
- name: sites
  description: Number of clinical sites enrolling participants.
  unit: sites
  aggregation: max
  dimensions:
  - account
  - study
- name: self_hosted_compute
  description: Infrastructure cost of running the self-hosted Community Edition (no OpenClinica invoice).
  unit: hours
  aggregation: sum
  dimensions:
  - deployment
principles:
- name: Visibility
  description: Track studies, participants, and sites against the Enterprise agreement; on self-hosted, monitor infrastructure and operational/validation effort.
- name: Allocation
  description: Map studies and sites to sponsors, teams, or grants so cost attributes to the right program.
- name: Optimization
  description: Retire or archive completed studies, use bulk endpoints to reduce operational effort, and self-host when program scale and in-house capacity favor owned infrastructure over a hosted subscription.
- name: Accountability
  description: Assign an owner per study; review participant and site counts against the subscription tier or infrastructure budget each period.
