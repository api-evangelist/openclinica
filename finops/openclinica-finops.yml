description: >-
  FinOps view of OpenClinica spend. The Community Edition is open source (LGPL)
  and free to self-host - in that model cost is your own compute, storage,
  network, and operational effort to run and validate the platform, with no
  vendor invoice. The Enterprise Edition is a hosted subscription sold by quote,
  where cost is driven by the scope of your program - number of studies,
  participants, sites, and the support and validation services included. The REST
  API adds no separate charge in either edition.
notes: >-
  Enterprise per-unit rates are not reconciled here; verify with OpenClinica
  sales. For self-hosted deployments, dominant costs are infrastructure and the
  staff time to install, validate (GxP/21 CFR Part 11 contexts), and maintain the
  system rather than a license fee.
