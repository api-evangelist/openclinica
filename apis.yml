aid: openclinica
url: https://raw.githubusercontent.com/api-evangelist/openclinica/refs/heads/main/apis.yml
name: OpenClinica
kind: company
description: OpenClinica is a clinical-trial electronic data capture (EDC) and
  clinical data management platform used to build studies, capture case report
  form (CRF) data, schedule study events, and manage participants across sites.
  It ships as a free, open-source Community Edition (LGPL) and as a fully
  supported, hosted Enterprise Edition. OpenClinica exposes a documented REST web
  services API - authenticated with OAuth 2.0 bearer tokens - for programmatically
  adding and updating participants (single and bulk), scheduling and updating
  study events, and importing and retrieving clinical data. Data is interchanged
  using the CDISC ODM (Operational Data Model) standard as XML or JSON, so studies
  remain portable and standards-based.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
